<div class="dashboard-container">
    <h1>Vendor Dashboard</h1>

    <div class="stats-grid">
        <mat-card class="stat-card">
            <mat-card-content>
                <div class="stat-icon">
                    <mat-icon>inventory_2</mat-icon>
                </div>
                <div class="stat-info">
                    <h2>{{ totalProducts }}</h2>
                    <p>My Products</p>
                </div>
            </mat-card-content>
        </mat-card>

        <mat-card class="stat-card">
            <mat-card-content>
                <div class="stat-icon">
                    <mat-icon>warehouse</mat-icon>
                </div>
                <div class="stat-info">
                    <h2>{{ totalWarehouses }}</h2>
                    <p>Warehouses</p>
                </div>
            </mat-card-content>
        </mat-card>
    </div>

    <div class="quick-actions">
        <h2>Quick Actions</h2>
        <div class="actions-grid">
            <button mat-raised-button color="primary" routerLink="/vendor/product-catalog">
                <mat-icon>category</mat-icon>
                Product Catalog
            </button>
            <button mat-raised-button color="accent" routerLink="/vendor/performance">
                <mat-icon>trending_up</mat-icon>
                Performance
            </button>
        </div>
    </div>
</div>
