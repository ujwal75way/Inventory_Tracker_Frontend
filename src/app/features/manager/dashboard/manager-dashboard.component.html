<div class="dashboard-container">
    <h1>Warehouse Manager Dashboard</h1>

    <div class="stats-grid">
        <mat-card class="stat-card">
            <mat-card-content>
                <div class="stat-icon">
                    <mat-icon>inventory</mat-icon>
                </div>
                <div class="stat-info">
                    <h2>{{ totalItems }}</h2>
                    <p>Total Inventory Items</p>
                </div>
            </mat-card-content>
        </mat-card>

        <mat-card class="stat-card warning">
            <mat-card-content>
                <div class="stat-icon">
                    <mat-icon>warning</mat-icon>
                </div>
                <div class="stat-info">
                    <h2>{{ lowStockCount }}</h2>
                    <p>Low Stock Items</p>
                </div>
            </mat-card-content>
        </mat-card>

        <mat-card class="stat-card danger">
            <mat-card-content>
                <div class="stat-icon">
                    <mat-icon>error</mat-icon>
                </div>
                <div class="stat-info">
                    <h2>{{ outOfStockCount }}</h2>
                    <p>Out of Stock Items</p>
                </div>
            </mat-card-content>
        </mat-card>
    </div>

    <div class="quick-actions">
        <h2>Quick Actions</h2>
        <div class="actions-grid">
            <button mat-raised-button color="primary" routerLink="/manager/inventory">
                <mat-icon>list</mat-icon>
                View Inventory
            </button>
            <button mat-raised-button color="accent" routerLink="/manager/stock-adjustment">
                <mat-icon>swap_horiz</mat-icon>
                Stock Adjustment
            </button>
            <button mat-raised-button color="primary" routerLink="/manager/bulk-upload">
                <mat-icon>upload</mat-icon>
                Bulk Upload
            </button>
            <button mat-raised-button color="accent" routerLink="/manager/reports">
                <mat-icon>assessment</mat-icon>
                Reports
            </button>
        </div>
    </div>
</div>
